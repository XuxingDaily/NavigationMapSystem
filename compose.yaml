name: nav-map-sys

services:
  postgres:
    image: pgrouting/pgrouting:17-3.5-3.8.0
    environment:
      POSTGRES_DB: nav
      POSTGRES_USER: nav
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nav_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nav -d nav"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:8.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:${REDIS_PUBLIC_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: nav-map-sys-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/nav
      DATABASE_USERNAME: nav
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-nav_dev_password}
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DATABASE: "0"
      SERVER_PORT: "8080"
      TZ: Asia/Shanghai
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
